import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'ru.sokolovromann.myshopping'
    buildToolsVersion '37.0.0'
    compileSdkVersion 37

    defaultConfig {
        applicationId "ru.sokolovromann.myshopping"
        versionCode 42
        versionName "3.0.0-dev"
        minSdk 28
        targetSdk 37

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

dependencies {
    implementation project(':core:data')
    implementation project(':core:domain')
    implementation project(':core:navigation')
    implementation project(':core:ui')
    implementation project(':feature:migration')
    implementation project(':old:api15')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.compose.material:material:1.12.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'
}